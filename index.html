<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d16">
<meta name="description" content="SAQI DIGITAL HUB - Premium digital subscriptions, AI tools, VPN, editing and designing services.">
<title>SAQI DIGITAL HUB | We Provide Quality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#080d16;--panel:#101a29;--panel2:#142237;--ink:#f5f8ff;--muted:#aab6c8;--blue:#36a9ff;--cyan:#55e1ee;--line:#ffffff18;--gold:#f6c86a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
a{text-decoration:none;color:inherit}
button,input{font:inherit}
.container{width:min(1160px,90%);margin:auto}
header{height:82px;position:sticky;top:0;z-index:1000;background:#080d16ed;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.header-inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:22px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:112px;height:66px;object-fit:contain;border-radius:8px}
.brand span{font-size:14px;font-weight:900;letter-spacing:1.2px;white-space:nowrap}
nav{display:flex;align-items:center;gap:22px}
nav a{font-size:12px;font-weight:700;color:#d5deeb;transition:.25s}
nav a:hover{color:var(--cyan)}
.menu-btn{display:none;background:none;border:0;color:white;font-size:24px}
.hero{min-height:620px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 15% 25%,#0d477155,transparent 38%),radial-gradient(ellipse at 85% 75%,#075b6c55,transparent 35%),linear-gradient(135deg,#080d16,#101d2d 60%,#080d16)}
.hero:before,.hero:after{content:"";position:absolute;width:360px;height:360px;border:1px solid #52d8ff20;border-radius:50%;filter:blur(1px)}
.hero:before{top:-190px;left:-100px}.hero:after{bottom:-230px;right:-100px}
.slider{width:min(1000px,90%);height:520px;position:relative;z-index:1}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 10px;opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .45s ease,transform .45s ease,visibility .45s}
.slide.active{opacity:1;visibility:visible;transform:translateY(0)}
.hero-logo{width:min(370px,76vw);height:220px;object-fit:contain;border-radius:12px;filter:drop-shadow(0 18px 32px #0009);margin-bottom:20px}
.kicker{color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:4px;text-transform:uppercase;margin-bottom:12px}
.slide h1{font-size:clamp(35px,7vw,72px);line-height:1.04;font-weight:900;letter-spacing:-1.5px}
.gradient{background:linear-gradient(90deg,#fff,var(--cyan),#5baaff);background-clip:text;-webkit-background-clip:text;color:transparent}
.slide h3{font-size:clamp(17px,3vw,25px);color:var(--gold);margin:15px 0 10px}
.slide p{max-width:690px;color:#c1ccda;line-height:1.8;font-size:15px}
.actions{display:flex;justify-content:center;gap:13px;flex-wrap:wrap;margin-top:25px}
.btn{border:1px solid transparent;padding:13px 23px;border-radius:50px;background:linear-gradient(110deg,#168bdc,#27c5d7);color:#06111c;font-size:13px;font-weight:900;box-shadow:0 9px 28px #159ed944;transition:.25s}
.btn:hover{transform:translateY(-4px);box-shadow:0 14px 30px #159ed966}
.btn.ghost{background:#ffffff0c;color:white;border-color:#ffffff38;box-shadow:none}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:9px}
.dot{width:9px;height:9px;border:0;border-radius:20px;background:#627186;cursor:pointer;transition:.25s}
.dot.active{width:29px;background:var(--cyan)}
.trust-strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#0c1421;padding:17px 0}
.trust-inner{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;color:#bdc9d9;font-size:12px;font-weight:700}
.trust-inner i{color:var(--cyan);margin-right:7px}
section{padding:78px 0}
.section-head{text-align:center;margin:0 auto 35px;max-width:720px}
.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px}
.section-head h2{font-size:clamp(28px,4.5vw,43px);font-weight:900}
.section-head p{color:var(--muted);font-size:14px;line-height:1.8;margin-top:10px}
.search-wrap{max-width:540px;margin:0 auto 34px;position:relative}
.search-wrap i{position:absolute;left:18px;top:17px;color:#8fa2b9}
.search-wrap input{width:100%;padding:15px 18px 15px 47px;border-radius:50px;background:#111d2d;border:1px solid #ffffff22;color:white;outline:none}
.search-wrap input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #55e1ee18}
.category-nav{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-bottom:46px}
.category-nav a{font-size:11px;font-weight:800;color:#c5d1e0;border:1px solid #ffffff20;background:#101a29;padding:9px 14px;border-radius:30px;transition:.2s}
.category-nav a:hover{background:#163b50;border-color:var(--cyan);color:white}
.service-section{padding:42px 0 48px;border-top:1px solid #ffffff12;scroll-margin-top:90px}
.service-section:first-of-type{border-top:0}
.category-title{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.category-title .cat-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;color:#06121e;font-size:20px;background:linear-gradient(145deg,#fff,var(--cyan));box-shadow:7px 8px 18px #0008,-2px -2px 8px #ffffff25}
.category-title h3{font-size:23px;font-weight:900}
.category-title p{font-size:12px;color:var(--muted);margin-top:3px}
.service-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.service-card{min-height:174px;position:relative;overflow:hidden;padding:22px 17px;border-radius:19px;background:linear-gradient(145deg,#17263a,#0e1929);border:1px solid #ffffff18;box-shadow:0 12px 28px #0004;transition:transform .28s,border-color .28s,box-shadow .28s}
.service-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 0%,#3bbfe51b,transparent 48%);pointer-events:none}
.service-card:hover{transform:translateY(-7px);border-color:#55e1ee88;box-shadow:0 18px 35px #0007,0 0 22px #37c8e51c}
.icon-3d{width:57px;height:57px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#f9fcff,#b8c9d9);box-shadow:7px 8px 13px #0008,inset -3px -4px 7px #7d8fa4,inset 2px 2px 5px #fff;color:#111d2b;margin-bottom:15px;transform:perspective(300px) rotateX(7deg) rotateY(-7deg);transition:.3s}
.service-card:hover .icon-3d{transform:perspective(300px) rotateY(12deg) rotateX(-5deg) scale(1.06)}
.icon-3d img{width:31px;height:31px;object-fit:contain}
.icon-3d i{font-size:27px}
.service-card h4{font-size:15px;font-weight:800;margin-bottom:5px;position:relative}
.service-card p{font-size:11px;color:#aebdd0;line-height:1.6;position:relative}
.order-link{display:inline-block;margin-top:11px;color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:.5px}
.empty{display:none;text-align:center;color:var(--muted);padding:25px}
.why{background:linear-gradient(180deg,#0b1421,#101d2d)}
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.why-card{padding:28px;border:1px solid #ffffff17;border-radius:18px;background:#ffffff08;text-align:center}
.why-card i{font-size:28px;color:var(--cyan);margin-bottom:14px}
.why-card h3{font-size:17px;margin-bottom:8px}
.why-card p{font-size:12px;color:var(--muted);line-height:1.8}
.about-box{max-width:850px;text-align:center;margin:auto}
.about-box p{color:var(--muted);font-size:14px;line-height:2}
.contact{background:radial-gradient(ellipse at 50% 100%,#12425a55,transparent 55%),#0d1725;text-align:center}
.contact p{color:var(--muted);max-width:620px;margin:12px auto 25px;line-height:1.8;font-size:14px}
.contact-links{display:flex;justify-content:center;gap:13px;flex-wrap:wrap}
.contact-card{display:flex;align-items:center;gap:12px;padding:14px 20px;border:1px solid #ffffff24;background:#ffffff0b;border-radius:14px;text-align:left;transition:.25s}
.contact-card:hover{transform:translateY(-5px);border-color:var(--cyan)}
.contact-card i{font-size:26px}.contact-card small{display:block;color:var(--muted);font-size:10px}.contact-card strong{font-size:13px}
.fa-whatsapp{color:#25d366}.fa-instagram{color:#f06aa6}
footer{background:#060a11;border-top:1px solid #ffffff14;padding:38px 0 20px}
.footer-inner{display:flex;justify-content:space-between;gap:25px;flex-wrap:wrap}
.footer-brand{font-weight:900;letter-spacing:1px}.footer-brand p{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0;margin-top:7px}
.footer-links{display:flex;gap:17px;flex-wrap:wrap}.footer-links a{font-size:11px;color:#b8c5d6}.footer-links a:hover{color:var(--cyan)}
.copy{border-top:1px solid #ffffff13;margin-top:25px;padding-top:17px;text-align:center;color:#8190a3;font-size:10px}
.float-wa{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#20c968;color:white;font-size:29px;z-index:999;box-shadow:0 8px 25px #0008;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 11px #20c96820,0 8px 25px #0008}}
@media(max-width:900px){.service-grid{grid-template-columns:repeat(3,1fr)}nav{gap:13px}nav a{font-size:10px}}
@media(max-width:680px){
 header{height:72px}.brand img{width:82px;height:55px}.brand span{font-size:11px}
 .menu-btn{display:block}
 nav{display:none;position:absolute;top:71px;left:0;right:0;padding:20px;background:#0b1421;border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;gap:0}
 nav.show{display:flex}nav a{font-size:13px;padding:12px 5%;border-bottom:1px solid #ffffff10}
 .hero{min-height:570px}.slider{height:500px;width:92%}.hero-logo{height:175px;width:min(310px,82vw)}
 .slide p{font-size:13px}.slide h1{font-size:clamp(34px,10vw,52px)}
 section{padding:60px 0}.service-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
 .service-card{padding:17px 13px;min-height:166px}.category-title h3{font-size:20px}
 .category-title .cat-icon{width:43px;height:43px}.why-grid{grid-template-columns:1fr}
 .trust-inner{gap:13px;font-size:10px}.footer-inner{flex-direction:column}
}
@media(max-width:360px){.service-grid{grid-template-columns:1fr}.brand span{font-size:10px}}
</style>
</head>
